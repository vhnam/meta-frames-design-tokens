# Git hooks (https://lefthook.dev/configuration/). `pnpm install` installs them.
pre-commit:
  piped: true
  jobs:
    - name: format
      glob: "*.{ts,json,md,yml,yaml}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.ts"
      run: pnpm exec oxlint --deny-warnings {staged_files}
    - name: typecheck
      glob: "*.ts"
      run: pnpm typecheck
    - name: generated files match the source
      glob: "{tokens/*.json,src/*.ts,package.json,pnpm-lock.yaml}"
      run: pnpm check

pre-push:
  jobs:
    - name: format
      run: pnpm format:check
    - name: test
      run: pnpm test
    - name: trivy
      run: >-
        command -v trivy >/dev/null ||
        { echo "trivy is not installed. Install it with 'brew install trivy' (https://trivy.dev)." >&2; exit 1; };
        trivy fs --quiet --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed
        --scanners vuln,secret,misconfig --skip-dirs node_modules .
